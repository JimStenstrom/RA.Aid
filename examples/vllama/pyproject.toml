[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllama"
version = "0.1.0"
description = "High-performance LLM server combining vLLM's speed with Ollama's UX"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Demo Project", email = "demo@example.com"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.scripts]
vllama = "vllama.__main__:main"
